image: prom/prometheus:v3.16.0
storage: 5Gi
# Minikube hostPath-backed storage may not apply fsGroup ownership automatically.
volumePermissions:
  enabled: true
  image: busybox:1.38.0
retentionTime: 7d
retentionSize: 4GB
# Discover nodes and collect kubelet/container metrics through the authenticated API proxy.
kubernetesMetrics:
  enabled: true
# Scrape istiod and the Istio sidecars for Kiali; adds pod list/watch to the ClusterRole (needs kubernetesMetrics).
istioMetrics:
  enabled: true
# Accept metrics pushed from clusters this Prometheus cannot reach. The Secret is created by hand: see README.
remoteWrite:
  enabled: true
  secretName: prometheus-remote-write-auth
# Add Kubernetes-reachable scrape jobs here. Use Kubernetes service DNS names.
# Only services whose /metrics endpoint answers are listed; files/alerts.yml uses these job names.
extraScrapeConfigs:
  # RoboShop (roboshop-ai) is not on mk4 since the EKS move; its scrape job and alerts were removed 2026-11-03
  # because every target was down and RoboShopServiceDown fired forever. Restore both if it comes back.
  # jithendar.com: every site pod, found through the headless Service jithendar-com-metrics (DNS A records),
  # so no Kubernetes API permissions are needed. Port 9464 is cluster-internal (NetworkPolicy in that repo).
  - job_name: jithendar-com
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["jithendar-com-metrics.jithendar.svc.cluster.local"]
        type: A
        port: 9464
    relabel_configs:
      - target_label: service
        replacement: jithendar-com
  # jithendar.com's SEO agent (mrjithendar/moks-seo-agent): flows, crews, tasks, tool calls, LLM spend, news desk, MCP.
  # /metrics on the internal API port through the headless Service seo-agent-metrics; the seo-agent NetworkPolicy
  # (jithendar.com kubernetes/seo-agent-40-seo-agent.yaml) admits app=roboshop-prometheus on 8080. Dashboards:
  # Jithendar.com · SEO agents, · CrewAI and · News desk, which all select job="seo-agent".
  - job_name: seo-agent
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["seo-agent-metrics.jithendar.svc.cluster.local"]
        type: A
        port: 8080
    relabel_configs:
      - target_label: service
        replacement: seo-agent
  # MOKS (namespace moks-sre, mrjithendar/moks-sre): every MOKS process (app=moks: api, worker, crewai, executor,
  # terminal) and the reranker and embedder, found by pod (pod list/watch, istioMetrics) so each series says which one:
  # instance and pod are the pod name, component is the process (the MOKS dashboards' Component variable). Prometheus
  # scrapes through its sidecar; the headless Services moks-metrics, moks-reranker-metrics and moks-embedder-metrics let
  # it send mTLS to their :9464, and the moks NetworkPolicies admit the monitoring namespace on 9464 only. Same block as
  # moks-sre deploy/grafana/prometheus-scrape.yaml; alerts in files/alerts.yml (groups moks*).
  - job_name: moks
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [moks-sre]
    relabel_configs:
      # The metrics port of MOKS's own pods only: not the diagnostic and terminal session pods, not the sidecars' ports.
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number]
        regex: moks(-reranker|-embedder)?;9464
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed
        action: drop
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: moks-(.+)
        target_label: component
      - source_labels: [__meta_kubernetes_pod_label_component]
        regex: (.+)
        target_label: component
      - target_label: service
        replacement: moks
  # CloudNativePG cluster (namespace postgres-db): every instance's exporter (container port "metrics", :9187), found
  # through the Kubernetes API (pod list/watch, kubernetesMetrics) so each series carries its pod name; PgBouncer pods
  # (cnpg.io/podRole=pooler) have no exporter on that port. cnpg_pg_replication_lag and cnpg_collector_up are the ones
  # to watch. The access chart's NetworkPolicy admits monitoring on 9187. Dashboard: Platform / PostgreSQL cluster.
  - job_name: postgres
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [postgres-db]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster, __meta_kubernetes_pod_label_cnpg_io_podRole, __meta_kubernetes_pod_container_port_name]
        action: keep
        regex: postgres-cluster;instance;metrics
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: postgres-cluster
  # Shared Valkey (namespace redis, deploy/minikube/redis): every pod's redis_exporter (container port 9121), found
  # through the Kubernetes API so each series carries its pod name. The headless Service
  # valkey-metrics-pods (redis/access) must keep declaring :9121: it is what makes the scrape go out as mTLS (namespace
  # redis is STRICT). redis_connected_slaves, redis_memory_used_bytes and redis_evicted_keys_total are the ones to
  # watch. The access chart's AuthorizationPolicy and NetworkPolicy admit monitoring on 9121.
  # Dashboard: Platform / Redis (Valkey).
  - job_name: redis
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [redis]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
        action: keep
        regex: valkey;9121
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: valkey
  # GitHub Actions runners (deploy/minikube/runners): Actions Runner Controller's controller and the mk4 scale set's
  # listener, both in runners-system, found by pod: container port "metrics" (:8080, runners/controller.yaml). component
  # is controller or listener. Not meshed, so the scrapes are plain text. No namespace target label: the listener's
  # series carry the scale set's own name (mk4) and namespace (runners). Kept: ARC's own gha_* series and the
  # controller's reconcile counters and queue depth; its other controller-runtime, REST client and Go series dropped.
  # Dashboards: Platform · GitHub runners (this job) and Platform · GitHub runner pods (cAdvisor).
  - job_name: arc
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [runners-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed
        action: drop
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: controller-manager
        target_label: component
        replacement: controller
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: runner-scale-set-listener
        target_label: component
        replacement: listener
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'gha_.+|controller_runtime_reconcile_(total|errors_total)|workqueue_depth'
        action: keep
  - job_name: loki
    static_configs:
      - targets: ["loki.monitoring.svc.cluster.local:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy.monitoring.svc.cluster.local:12345"]
  # Trace pipeline health: spans accepted/refused/failed by the collector and Jaeger's own receiver and storage.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.observability.svc.cluster.local:8888"]
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger.observability.svc.cluster.local:8888"]

# No node pin: the local-path volume keeps the pod on the node that holds its data.
nodeSelector: {}
